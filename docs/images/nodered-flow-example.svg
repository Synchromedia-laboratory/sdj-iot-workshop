<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Node-RED MQTT flow example</title>
  <desc id="desc">A visual Node-RED flow showing MQTT input nodes for temperature, humidity, and distance connected to dashboard and debug nodes.</desc>
  <rect width="1200" height="620" fill="#f4f5f7"/>

  <rect x="0" y="0" width="1200" height="64" fill="#8f0000"/>
  <text x="34" y="41" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Node-RED</text>
  <circle cx="1130" cy="32" r="14" fill="#ffffff" opacity="0.85"/>
  <circle cx="1164" cy="32" r="14" fill="#ffffff" opacity="0.85"/>

  <rect x="0" y="64" width="260" height="556" fill="#ffffff"/>
  <text x="26" y="112" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263447">Nodes</text>
  <rect x="24" y="145" width="190" height="42" rx="5" fill="#d9ead3" stroke="#7cb342"/>
  <text x="46" y="172" font-family="Arial, sans-serif" font-size="16" fill="#263447">mqtt in</text>
  <rect x="24" y="204" width="190" height="42" rx="5" fill="#d9eaf7" stroke="#4a90e2"/>
  <text x="46" y="231" font-family="Arial, sans-serif" font-size="16" fill="#263447">function</text>
  <rect x="24" y="263" width="190" height="42" rx="5" fill="#eadcf8" stroke="#8e44ad"/>
  <text x="46" y="290" font-family="Arial, sans-serif" font-size="16" fill="#263447">dashboard</text>
  <rect x="24" y="322" width="190" height="42" rx="5" fill="#f7e6cc" stroke="#e67e22"/>
  <text x="46" y="349" font-family="Arial, sans-serif" font-size="16" fill="#263447">debug</text>

  <rect x="286" y="92" width="880" height="492" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="318" y="132" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263447">Flow 1 - MQTT sensors</text>

  <g font-family="Arial, sans-serif" font-size="17" fill="#263447">
    <rect x="330" y="190" width="180" height="54" rx="8" fill="#d9ead3" stroke="#7cb342" stroke-width="2"/>
    <text x="360" y="224">mqtt in: temp</text>

    <rect x="330" y="288" width="180" height="54" rx="8" fill="#d9ead3" stroke="#7cb342" stroke-width="2"/>
    <text x="346" y="322">mqtt in: humidity</text>

    <rect x="330" y="386" width="180" height="54" rx="8" fill="#d9ead3" stroke="#7cb342" stroke-width="2"/>
    <text x="346" y="420">mqtt in: distance</text>

    <rect x="620" y="288" width="180" height="54" rx="8" fill="#d9eaf7" stroke="#4a90e2" stroke-width="2"/>
    <text x="658" y="322">format value</text>

    <rect x="900" y="222" width="180" height="54" rx="8" fill="#eadcf8" stroke="#8e44ad" stroke-width="2"/>
    <text x="948" y="256">dashboard</text>

    <rect x="900" y="354" width="180" height="54" rx="8" fill="#f7e6cc" stroke="#e67e22" stroke-width="2"/>
    <text x="970" y="388">debug</text>
  </g>

  <g fill="none" stroke="#68778d" stroke-width="4">
    <path d="M510 217 C560 217 570 295 620 315"/>
    <path d="M510 315 L620 315"/>
    <path d="M510 413 C560 413 570 335 620 315"/>
    <path d="M800 315 C850 315 850 249 900 249"/>
    <path d="M800 315 C850 315 850 381 900 381"/>
  </g>
  <g fill="#68778d">
    <polygon points="612,307 626,315 612,323"/>
    <polygon points="892,241 906,249 892,257"/>
    <polygon points="892,373 906,381 892,389"/>
  </g>

  <rect x="318" y="510" width="820" height="42" rx="8" fill="#eef3f8"/>
  <text x="338" y="537" font-family="Arial, sans-serif" font-size="16" fill="#506070">Node-RED listens to MQTT topics, transforms messages, and can send values to a dashboard or debug panel.</text>
</svg>
